name: Quotio
options:
  bundleIdPrefix: app.bytrong.quotio
  deploymentTarget:
    iOS: '26.0'
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  QuotioMobile:
    path: .
  QuotioHostClient:
    path: ../../Packages/QuotioHostClient
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    QUOTIO_APP_GROUP: group.app.bytrong.quotio.ios
    QUOTIO_KEYCHAIN_GROUP: $(AppIdentifierPrefix)app.bytrong.quotio.ios.hosts
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  QuotioIOS:
    type: application
    platform: iOS
    sources: [QuotioIOS, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bytrong.quotio.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: QuotioMobile
      - package: QuotioHostClient
      - target: QuotioWidgets
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Quotio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Scan a Quotio device code from your computer to connect this iPhone.
        NSLocalNetworkUsageDescription: Connect to Quotio on your computer to display quota and usage.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        QuotioAppGroup: $(QUOTIO_APP_GROUP)
        QuotioKeychainGroup: $(QUOTIO_KEYCHAIN_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: app.bytrong.quotio.ios.account
            CFBundleURLSchemes: [quotio]
    entitlements:
      path: Config/QuotioIOS.entitlements
      properties:
        com.apple.security.application-groups: [$(QUOTIO_APP_GROUP)]
        keychain-access-groups: [$(QUOTIO_KEYCHAIN_GROUP)]
  QuotioWidgets:
    type: app-extension
    platform: iOS
    sources: [QuotioWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bytrong.quotio.ios.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          # Keep App Intents in the executable inspected by the metadata processor.
          ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: QuotioMobile
      - package: QuotioHostClient
    info:
      path: Config/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Quotio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        QuotioAppGroup: $(QUOTIO_APP_GROUP)
        QuotioKeychainGroup: $(QUOTIO_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/QuotioWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(QUOTIO_APP_GROUP)]
        keychain-access-groups: [$(QUOTIO_KEYCHAIN_GROUP)]
  QuotioIOSUITests:
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    type: bundle.ui-testing
    platform: iOS
    sources: [QuotioIOSUITests]
    dependencies:
      - target: QuotioIOS
  QuotioIOSUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [QuotioIOSUnitTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: QuotioIOS
      - package: QuotioMobile
      - package: QuotioHostClient
schemes:
  QuotioIOS:
    build:
      targets:
        QuotioIOS: all
    test:
      targets: [QuotioIOSUnitTests, QuotioIOSUITests]
    run:
      config: Debug
    archive:
      config: Release
