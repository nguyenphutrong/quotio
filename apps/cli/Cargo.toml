[package]
name = "quotio"
version = "0.2.12"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "process", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
time = { version = "=0.3.47", features = ["serde", "serde-well-known", "formatting", "macros"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
directories = "6"
base64 = "0.22"
ring = "0.17"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.5.1"
core-foundation = "0.10"
security-framework-sys = "2.15"

[dev-dependencies]
jsonschema = { version = "0.33.0", default-features = false }
tokio = { version = "1", features = ["test-util"] }
