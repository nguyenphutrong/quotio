[package]
name = "quotio"
version = "1.0.0-beta.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto", "pem"] }
if-addrs = "0.14"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "process", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "=0.0.27", default-features = false, features = ["deserialize"] }
toml = "0.9"
time = { version = "=0.3.47", features = ["serde", "serde-well-known", "formatting", "macros"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
directories = "6"
base64 = "0.22"
ring = "0.17"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
libc = "0.2"
terminal_size = "0.4"
unicode-width = "0.2"
tern-sdk = "0.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.5.1"
core-foundation = "0.10"
security-framework-sys = "2.15"

[dev-dependencies]
jsonschema = { version = "0.33.0", default-features = false }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory"] }
