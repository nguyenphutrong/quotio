name: Rust checks

on:
  pull_request:
    paths:
      - 'apps/cli/**'
      - 'apps/macos/Quotio/Assets.xcassets/ProviderIcons/**'
      - '.github/workflows/cli-ci.yml'
  push:
    branches: [master]
    paths:
      - 'apps/cli/**'
      - 'apps/macos/Quotio/Assets.xcassets/ProviderIcons/**'
      - '.github/workflows/cli-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/cli

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        toolchain: [stable, '1.88.0']
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo +"$TOOLCHAIN" fmt --check
      - name: Fetch locked dependencies
        run: cargo +"$TOOLCHAIN" fetch --locked
      - name: Check all targets
        run: cargo +"$TOOLCHAIN" clippy --offline --locked --all-targets --all-features -- -D warnings
      - name: Run offline tests and OpenAPI contract checks
        run: cargo +"$TOOLCHAIN" test --offline --locked --all-features
      - name: Test release notice generation
        if: matrix.toolchain == 'stable'
        run: python3 scripts/test-third-party-notices.py
      - name: Build release binary
        run: cargo +"$TOOLCHAIN" build --offline --locked --release

  distribution:
    name: Check release packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Check npm wrapper and release generation
        run: |
          node --test distribution/npm.test.cjs
          python3 scripts/test-package-release.py
          shellcheck scripts/ci-sign-macos.sh

  windows:
    name: Native Windows companion host
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check all Windows targets
        run: cargo check --locked --all-targets --all-features
      - name: Test DPAPI, host contract, device grants and listener isolation
        run: |
          cargo test --locked windows_vault
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked companion_listener
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked credentials_survive_restart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --test contract --test devices
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --test server_management
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native executable and smoke test
        run: |
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/quotio.exe usage --provider mock --no-saved-accounts --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash ./target/release/quotio.exe -Algorithm SHA256 | Format-List | Out-File ./target/release/quotio.exe.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quotio-windows-x86_64
          path: |
            apps/cli/target/release/quotio.exe
            apps/cli/target/release/quotio.exe.sha256
          if-no-files-found: error
